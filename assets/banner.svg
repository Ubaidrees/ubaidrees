<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Muhammad Ubaid - AI and Machine Learning student, Karachi</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1016"/><stop offset="1" stop-color="#151d28"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2DD4BF" stroke-width="0.6" opacity="0.10"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .code{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12px;fill:#c9d4df;white-space:pre}
    .k{fill:#FB7185} .n{fill:#2DD4BF} .c{fill:#6b7a8a}
    .hl{animation:scan 9s infinite;animation-timing-function:step-end}
    @keyframes scan{0.0%{transform:translateY(0px)} 11.11%{transform:translateY(20px)} 22.22%{transform:translateY(40px)} 33.33%{transform:translateY(60px)} 44.44%{transform:translateY(80px)} 55.56%{transform:translateY(100px)} 66.67%{transform:translateY(120px)} 77.78%{transform:translateY(140px)} 88.89%{transform:translateY(160px)} 100%{transform:translateY(0)}}
    .bar{fill:#2DD4BF;transform-box:fill-box;transform-origin:50% 100%;animation:settle 6s ease-in-out infinite}
    @keyframes settle{0%,12%{transform:scaleY(var(--s));fill:#FB7185}62%,100%{transform:scaleY(1);fill:#2DD4BF}}
    .cur{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="880" cy="150" rx="360" ry="160" fill="url(#glow)"/>

  <!-- left: identity -->
  <text class="sans" x="60" y="118" font-size="52" font-weight="700" fill="#E6EDF3" textLength="500" lengthAdjust="spacingAndGlyphs">Muhammad Ubaid</text>
  <rect x="60" y="132" width="86" height="4" rx="2" fill="#2DD4BF"/>
  <text class="sans" x="60" y="172" font-size="20" fill="#B6C2CE">BS Artificial Intelligence · DUET Karachi</text>
  <text class="mono" x="60" y="206" font-size="15" fill="#2DD4BF">// I like knowing what happens under the hood<tspan class="cur" fill="#FB7185">_</tspan></text>
  <g class="sans" font-size="12" font-weight="700" letter-spacing="1">
    <rect x="60" y="232" width="92" height="26" rx="13" fill="none" stroke="#2DD4BF"/><text x="106" y="249" text-anchor="middle" fill="#2DD4BF">AI / ML</text>
    <rect x="162" y="232" width="118" height="26" rx="13" fill="none" stroke="#FB7185"/><text x="221" y="249" text-anchor="middle" fill="#FB7185">ALGORITHMS</text>
    <rect x="290" y="232" width="118" height="26" rx="13" fill="none" stroke="#B6C2CE"/><text x="349" y="249" text-anchor="middle" fill="#B6C2CE">DATABASES</text>
  </g>

  <!-- right: editor window -->
  <rect x="630" y="36" width="360" height="222" rx="10" fill="#0a0e13" stroke="#2a3644"/>
  <path d="M630 46a10 10 0 0 1 10-10h340a10 10 0 0 1 10 10v16H630z" fill="#121a24"/>
  <circle cx="648" cy="49" r="4" fill="#FB7185"/><circle cx="662" cy="49" r="4" fill="#E9C46A"/><circle cx="676" cy="49" r="4" fill="#2DD4BF"/>
  <text class="mono" x="700" y="53" font-size="11" fill="#8b98a5">binary_search.cpp</text>
  <rect class="hl" x="636" y="72" width="348" height="18" rx="3" fill="#2DD4BF" opacity="0.14"/>
  <g>
    <text class="code" xml:space="preserve" x="646" y="86"><tspan class="k">int</tspan> binarySearch(vector&lt;<tspan class="k">int</tspan>&gt;&amp; a, <tspan class="k">int</tspan> x) {</text>
    <text class="code" xml:space="preserve" x="646" y="106">  <tspan class="k">int</tspan> lo = <tspan class="n">0</tspan>, hi = a.size() - <tspan class="n">1</tspan>;</text>
    <text class="code" xml:space="preserve" x="646" y="126">  <tspan class="k">while</tspan> (lo &lt;= hi) {</text>
    <text class="code" xml:space="preserve" x="646" y="146">    <tspan class="k">int</tspan> mid = lo + (hi - lo) / <tspan class="n">2</tspan>;</text>
    <text class="code" xml:space="preserve" x="646" y="166">    <tspan class="k">if</tspan> (a[mid] == x) <tspan class="k">return</tspan> mid;</text>
    <text class="code" xml:space="preserve" x="646" y="186">    a[mid] &lt; x ? lo = mid + <tspan class="n">1</tspan> : hi = mid - <tspan class="n">1</tspan>;</text>
    <text class="code" xml:space="preserve" x="646" y="206">  }</text>
    <text class="code" xml:space="preserve" x="646" y="226">  <tspan class="k">return</tspan> -<tspan class="n">1</tspan>;  <tspan class="c">// O(log n)</tspan></text>
    <text class="code" xml:space="preserve" x="646" y="246">}</text>
  </g>

  <!-- right: quicksort panel -->
  <rect x="1005" y="36" width="160" height="222" rx="10" fill="#0a0e13" stroke="#2a3644"/>
  <text class="mono" x="1013" y="60" font-size="11" fill="#8b98a5">quicksort()</text>
  <g>
    <rect class="bar" x="1013" y="192" width="10" height="20" rx="2" style="--s:4.600"/>
    <rect class="bar" x="1028" y="180" width="10" height="32" rx="2" style="--s:1.375"/>
    <rect class="bar" x="1043" y="168" width="10" height="44" rx="2" style="--s:2.909"/>
    <rect class="bar" x="1058" y="156" width="10" height="56" rx="2" style="--s:0.357"/>
    <rect class="bar" x="1073" y="144" width="10" height="68" rx="2" style="--s:1.000"/>
    <rect class="bar" x="1088" y="132" width="10" height="80" rx="2" style="--s:1.450"/>
    <rect class="bar" x="1103" y="120" width="10" height="92" rx="2" style="--s:0.348"/>
    <rect class="bar" x="1118" y="108" width="10" height="104" rx="2" style="--s:1.000"/>
    <rect class="bar" x="1133" y="96" width="10" height="116" rx="2" style="--s:0.483"/>
    <rect class="bar" x="1148" y="84" width="10" height="128" rx="2" style="--s:0.625"/>
  </g>
  <line x1="1011" y1="213" x2="1159" y2="213" stroke="#2a3644"/>
  <text class="mono" x="1085" y="240" font-size="13" font-weight="700" fill="#2DD4BF" text-anchor="middle">O(n log n)</text>
</svg>
